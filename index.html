<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cloudvibe GmbH — Your IT. Our business. | IT-Betreuung & TI aus Goch</title>
    <meta
      name="description"
      content="Managed IT und TI-Anbindung für Arztpraxen, Apotheken, Pflegeeinrichtungen, Kanzleien und KMU: Konnektor, TI-Gateway, KIM, DATEV, SelectLine, Backup, Firewall. Telekonnekt-Partner aus Goch."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Comfortaa:wght@400;600;700&family=Geist+Mono:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var param = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('cloudvibe-theme');
          var theme =
            param === 'light' || param === 'dark'
              ? param
              : saved === 'light' || saved === 'dark'
                ? saved
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
